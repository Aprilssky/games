name: Build games

on:
  push:
    branches: [main]
    paths:
      - 'bowling-src/**'
      - '3d-dominoes-src/**'
      - 'scripts/**'
      - '.github/workflows/build-games.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bowling-src/package-lock.json
            3d-dominoes-src/package-lock.json

      - name: Build bowling
        working-directory: bowling-src
        run: |
          npm ci
          npm run build
          node ../scripts/inline-build.mjs . ../bowling.html

      - name: Build 3d-dominoes
        working-directory: 3d-dominoes-src
        run: |
          npm ci
          npm run build
          node ../scripts/inline-build.mjs . ../dominoes.html

      - name: Commit built bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bowling.html dominoes.html
          if git diff --cached --quiet; then
            echo "产物无变化,跳过提交"
          else
            git commit -m "🤖 Auto-build: update game bundles"
            git push
          fi
