ff}.tool-btn.danger{background:#f43f5e1f;color:#e11d48}.tool-btn.danger:hover{background:#f43f5e33}.caret{font-size:10px;opacity:.7;margin-left:2px}@keyframes pulse{0%{box-shadow:0 0 #f9731680}to{box-shadow:0 0 0 10px #f9731600}}.dropdown{position:relative;display:inline-block}.dropdown-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:150px;background:#fffffff5;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(90,110,150,.15);border-radius:12px;padding:5px;z-index:300;box-shadow:0 12px 36px #506ea038}.dropdown-menu.open{display:block}.dropdown-item,.template-menu-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border:none;border-radius:8px;background:transparent;color:#4a5570;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .12s;width:100%;text-align:left;font-family:inherit}.dropdown-item:hover,.template-menu-item:hover{background:#6366f11f;color:#4f46e5}.template-menu-item .tpl-icon{font-size:16px;width:24px;text-align:center}.dropdown-sep{height:1px;background:#5a6e9626;margin:4px 8px}#color-panel{position:fixed;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;padding:12px 8px;background:#ffffffd1;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 8px 32px #506ea029;z-index:90}.color-btn{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.9);cursor:pointer;transition:all .15s;padding:0;box-shadow:0 2px 6px #3c507833}.color-btn:hover{transform:scale(1.15)}.color-btn.active{outline:2.5px solid #6366f1;outline-offset:2px;transform:scale(1.1)}#settings-panel{position:fixed;top:70px;right:-340px;width:320px;max-height:calc(100vh - 100px);overflow-y:auto;background:#fffffff2;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:18px;z-index:200;box-shadow:0 16px 48px #506ea040;transition:right .3s cubic-bezier(.4,0,.2,1)}#settings-panel.open{right:16px}.panel-header{padding:14px 18px 10px;font-size:14px;font-weight:700;color:#4c5a75;border-bottom:1px solid rgba(90,110,150,.12)}.panel-body{padding:6px 18px 18px}.setting-group{margin-top:14px}.setting-group-title{font-size:12px;font-weight:600;color:#8494b3;margin-bottom:8px}.seg{display:flex;gap:6px}.seg-btn{flex:1;padding:7px 0;border:1px solid rgba(90,110,150,.18);border-radius:9px;background:#6e82aa0f;color:#5a6b8c;font-size:13px;cursor:pointer;transition:all .12s;font-family:inherit}.seg-btn:hover{background:#6e82aa1f}.seg-btn.active{background:#6366f1;border-color:#6366f1;color:#fff}.setting-row-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;color:#4a5570}.switch{width:42px;height:24px;border-radius:12px;border:none;background:#6e82aa40;position:relative;cursor:pointer;transition:background .2s;padding:0}.switch:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px #0003}.switch.on{background:#6366f1}.switch.on:after{left:21px}.advanced-toggle{width:100%;padding:9px 0;border:none;background:#6e82aa14;border-radius:9px;color:#5a6b8c;font-size:12.5px;cursor:pointer;font-family:inherit;transition:background .12s}.advanced-toggle:hover{background:#6e82aa24}.advanced-body{display:none;margin-top:10px;padding:10px 12px;background:#6e82aa0f;border-radius:10px}.advanced-body.open{display:block}.setting-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px}.setting-label{width:42px;color:#8494b3;flex-shrink:0}.setting-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;-moz-appearance:none;appearance:none;background:#6e82aa33;border-radius:2px;outline:none}.setting-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#6366f1;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px #3c50784d}.setting-value{width:38px;text-align:right;color:#5a6b8c;font-variant-numeric:tabular-nums;flex-shrink:0}#status-bar{position:fixed;bottom:16px;left:50%;transform:translate(-50%);padding:7px 20px;background:#ffffffd1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:20px;font-size:12.5px;color:#6b7a99;z-index:100;white-space:nowrap;box-shadow:0 4px 20px #506ea024}.toast{position:fixed;bottom:64px;left:50%;transform:translate(-50%) translateY(8px);padding:9px 22px;background:#313a52eb;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:22px;font-size:13px;color:#f0f4fa;z-index:500;opacity:0;transition:all .25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%) translateY(0)}#help-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:#3c4b6e66;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}#help-overlay.open{display:flex}.help-card{background:#fff;border-radius:24px;padding:28px 30px;max-width:620px;width:100%;box-shadow:0 24px 80px #283c6459;animation:pop .25s ease-out}@keyframes pop{0%{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}.help-header{font-size:22px;font-weight:800;color:#3d4a66;text-align:center;margin-bottom:20px}.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.help-item{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;background:#f5f8fc;border:1px solid rgba(90,110,150,.08)}.help-icon{font-size:22px}.help-item b{font-size:14px;color:#3d4a66}.help-item span{font-size:12.5px;color:#7a89a8;line-height:1.5}.help-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}.help-tip{font-size:12.5px;color:#8494b3}.primary-btn{padding:11px 30px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px #6366f159;transition:transform .15s}.primary-btn:hover{transform:translateY(-1px)}@media(max-width:900px){#toolbar{top:8px;padding:6px 10px;gap:4px;border-radius:12px}.brand-text{display:none}.tool-btn{padding:6px 10px;font-size:12px}.tool-sep{height:22px;margin:0 2px}#color-panel{left:8px;padding:10px 6px;gap:8px}.color-btn{width:22px;height:22px}#settings-panel{width:280px}#status-bar{font-size:11px;padding:5px 14px;max-width:96vw;white-space:normal;text-align:center}.help-grid{grid-template-columns:1fr}.help-card{padding:20px}}

</style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="brand">
        <span class="brand-mark">🁎</span>
        <span class="brand-text">3D 多米诺</span>
      </div>

      <div class="tool-sep"></div>
      <div class="tool-group" id="mode-group">
        <button class="tool-btn active" data-tool="place" title="放置模式 (1)">🖐 放置</button>
        <button class="tool-btn" data-tool="move" title="移动模式 (2)">✋ 移动</button>
        <button class="tool-btn" data-tool="delete" title="删除模式 (3)">🗑 删除</button>
      </div>

      <div class="tool-sep"></div>
      <div class="tool-group">
        <button id="btn-play" class="tool-btn play" title="进入推倒模式">▶ 推倒</button>
        <button id="btn-auto" class="tool-btn" title="一键推倒第一块">🚀</button>
        <button id="btn-reset" class="tool-btn reset" title="复原 (Esc)" style="display:none">↺ 复原</button>
      </div>

      <div class="tool-sep"></div>
      <div class="tool-group">
        <button id="btn-undo" class="tool-btn icon" title="撤销 (Ctrl+Z)" disabled>↩</button>
        <button id="btn-redo" class="tool-btn icon" title="重做 (Ctrl+Shift+Z)" disabled>↪</button>
      </div>

      <div class="tool-sep"></div>
      <div class="dropdown" id="template-dropdown">
        <button id="btn-templates" class="tool-btn" title="自动排列模板">📐 模板 <span class="caret">▾</span></button>
        <div class="dropdown-menu" id="template-menu"></div>
      </div>

      <div class="tool-sep"></div>
      <div class="dropdown" id="archive-dropdown">
        <button id="btn-archive" class="tool-btn" title="存档与导入导出">💾 存档 <span class="caret">▾</span></button>
        <div class="dropdown-menu" id="archive-menu">
          <button class="dropdown-item" id="act-save">💾 保存到浏览器</button>
          <button class="dropdown-item" id="act-load">📂 读取存档</button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item" id="act-export">⬇ 导出为文件</button>
          <button class="dropdown-item" id="act-import">⬆ 从文件导入</button>
        </div>
      </div>

      <div class="tool-sep"></div>
      <div class="tool-group">
        <button id="btn-clear" class="tool-btn danger" title="清空所有骨牌">🗑 清空</button>
        <button id="btn-help" class="tool-btn icon" title="帮助">?</button>
        <button id="btn-settings" class="tool-btn icon" title="设置">⚙</button>
      </div>

      <div class="tool-spacer"></div>
      <div class="tool-info"><span id="domino-count">🁎 0</span></div>
    </div>

    <div id="color-panel" title="选择骨牌颜色"></div>

    <div id="settings-panel">
      <div class="panel-header">⚙ 设置</div>
      <div class="panel-body">
        <div class="setting-group">
          <div class="setting-group-title">骨牌尺寸</div>
          <div class="seg" id="setting-size"></div>
        </div>
        <div class="setting-group">
          <div class="setting-group-title">摆放间距</div>
          <div class="seg" id="setting-gap"></div>
        </div>
        <div class="setting-group">
          <div class="setting-row-toggle">
            <span>网格对齐</span>
            <button class="switch" id="toggle-snap" title="放置/移动时吸附到网格"></button>
          </div>
          <div class="setting-row-toggle">
            <span>音效</span>
            <button class="switch" id="toggle-sound" title="放置与碰撞音效"></button>
          </div>
        </div>
        <div class="setting-group">
          <button class="advanced-toggle" id="advanced-toggle">物理参数(高级) ▾</button>
          <div class="advanced-body" id="advanced-body"></div>
        </div>
      </div>
    </div>

    <div id="canvas-container"></div>
    <div id="status-bar"></div>

    <div id="help-overlay">
      <div class="help-card">
        <div class="help-header">🁎 欢迎来到 3D 多米诺</div>
        <div class="help-grid">
          <div class="help-item">
            <div class="help-icon">🖐</div>
            <b>放置</b>
            <span>左键单击放一块,按住左键拖动画出一长排</span>
          </div>
          <div class="help-item">
            <div class="help-icon">✋</div>
            <b>移动</b>
            <span>按住骨牌拖到新位置,支持网格对齐</span>
          </div>
          <div class="help-item">
            <div class="help-icon">🗑</div>
            <b>删除</b>
            <span>单击删除,按住拖动连续清除</span>
          </div>
          <div class="help-item">
            <div class="help-icon">🖱</div>
            <b>视角</b>
            <span>右键拖动旋转 · 滚轮缩放 · 中键平移</span>
          </div>
          <div class="help-item">
            <div class="help-icon">▶</div>
            <b>推倒</b>
            <span>点击骨牌开始连锁,或 🚀 一键推倒</span>
          </div>
          <div class="help-item">
            <div class="help-icon">↩</div>
            <b>撤销</b>
            <span>Ctrl+Z 撤销 · Ctrl+Shift+Z 重做</span>
          </div>
        </div>
        <div class="help-footer">
          <span class="help-tip">💡 按 R 旋转放置方向 · 摆放自动保存到浏览器</span>
          <button id="help-close" class="primary-btn">开始搭建</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
