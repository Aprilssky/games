<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 小游戏合集</title>
<style>
:root {
  --bg: #0f0f1a; --surface: #1a1a2e; --surface2: #252542;
  --text: #e0e0f0; --text2: #9292b0; --accent: #6c63ff;
  --accent2: #4ade80; --accent3: #f472b6; --border: #2a2a4a;
  --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f0f0f5; --surface: #ffffff; --surface2: #e8e8f0;
  --text: #1a1a2e; --text2: #666680; --accent: #5b52e0;
  --border: #d0d0e0; --shadow: 0 4px 24px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; transition: background .3s;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 20px; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 8px;
  cursor: pointer; font-size: 18px; display: flex;
  align-items: center; justify-content: center; transition: .2s;
}
.theme-btn:hover { background: var(--accent); color: white; }
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px; padding: 20px; max-width: 900px; margin: 0 auto;
}
.game-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; cursor: pointer;
  transition: all .25s; text-align: center;
  box-shadow: var(--shadow); text-decoration: none; display: block;
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 32px rgba(108,99,255,.25);
}
.game-card .icon { font-size: 36px; margin-bottom: 8px; }
.game-card .name { font-size: 15px; font-weight: 600; color: var(--text); }
.game-card .desc { color: var(--text2); font-size: 12px; line-height: 1.4; margin-top: 4px; }
@media(max-width:500px) {
  .game-grid { grid-template-columns: 1fr 1fr; padding: 12px; gap: 10px; }
  .game-card { padding: 14px; }
  .game-card .icon { font-size: 28px; }
}
</style>
</head>
<body>

<header class="header">
  <h1>🎮 小游戏合集</h1>
  <div class="header-actions">
    <button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌓</button>
  </div>
</header>

<div class="game-grid" id="gameGrid"></div>

<script>
const GAMES = [
  {id:'sudoku',icon:'🧩',name:'数独',desc:'经典 9×9 数独，三种难度'},
  {id:'minesweep',icon:'💣',name:'扫雷',desc:'经典扫雷，标记地雷揭开安全格'},
  {id:'match3',icon:'💎',name:'消消乐',desc:'交换宝石达成三连消除'},
  {id:'game2048',icon:'🔢',name:'2048',desc:'滑动合并方块挑战 2048'},
  {id:'snake',icon:'🐍',name:'贪吃蛇',desc:'吃食物变长，别撞墙'},
  {id:'tictactoe',icon:'❌',name:'井字棋',desc:'三连棋对弈 AI'},
  {id:'memory',icon:'🃏',name:'记忆翻牌',desc:'翻牌配对考验记忆力'},
  {id:'whack',icon:'🔨',name:'打地鼠',desc:'地鼠出没快速敲击得分'},
  {id:'dino',icon:'🦖',name:'恐龙跑酷',desc:'跳跃躲避障碍无尽奔跑'},
  {id:'numEater',icon:'🔢',name:'数字吞噬',desc:'棋盘吞噬数字闯关'},
  {id:'magictower',icon:'🏰',name:'魔塔',desc:'经典魔塔打怪升级夺钥匙'},
  {id:'tetris',icon:'🧱',name:'俄罗斯方块',desc:'旋转下落的经典解谜'},
  {id:'flappy',icon:'🐦',name:'Flappy Bird',desc:'点按控制小鸟穿管道'},
  {id:'reversi',icon:'⚫',name:'黑白棋',desc:'Reversi 对弈 AI'},
  {id:'breakout',icon:'🧱',name:'打砖块',desc:'挡板反弹击碎所有砖块'},
  {id:'gomoku',icon:'⚫',name:'五子棋',desc:'15×15 棋盘五子连珠 AI 对战'},
  {id:'chess',icon:'♟',name:'国际象棋',desc:'8×8 国际象棋 AI 对战'},
  {id:'xiangqi',icon:'🐴',name:'象棋',desc:'中国象棋 AI 对战'},
  {id:'bowling',icon:'🎳',name:'保龄球',desc:'3D 物理保龄球，瞄准蓄力投球'},
];

function toggleTheme() {
  const d = document.documentElement;
  d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', d.dataset.theme);
}
const saved = localStorage.getItem('theme');
if (saved) document.documentElement.dataset.theme = saved;

const grid = document.getElementById('gameGrid');
GAMES.forEach(g => {
  const a = document.createElement('a');
  a.className = 'game-card';
  a.href = g.id + '.html';
  a.innerHTML = '<div class="icon">'+g.icon+'</div><div class="name">'+g.name+'</div><div class="desc">'+g.desc+'</div>';
  grid.appendChild(a);
});
</script>
</body>
</html>
