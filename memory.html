<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 记忆翻牌</title>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #252542;
  --text: #e0e0f0;
  --text2: #9292b0;
  --accent: #6c63ff;
  --accent2: #4ade80;
  --accent3: #f472b6;
  --border: #2a2a4a;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f0f0f5;
  --surface: #ffffff;
  --surface2: #e8e8f0;
  --text: #1a1a2e;
  --text2: #666680;
  --accent: #5b52e0;
  --border: #d0d0e0;
  --shadow: 0 4px 24px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; transition: background .3s;
}
/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 20px; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 8px;
  cursor: pointer; font-size: 18px; display: flex;
  align-items: center; justify-content: center; transition: .2s;
}
.theme-btn:hover { background: var(--accent); color: white; }
/* Game Grid */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; padding: 24px; max-width: 900px; margin: 0 auto;
}
.game-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; cursor: pointer;
  transition: all .25s; text-align: center;
  box-shadow: var(--shadow);
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 32px rgba(108,99,255,.25);
}
.game-card .icon { font-size: 48px; margin-bottom: 12px; }
.game-card h3 { font-size: 18px; margin-bottom: 8px; }
.game-card p { color: var(--text2); font-size: 14px; line-height: 1.5; }
/* Game View */
.game-view {
  display: none;
  padding: 20px; max-width: 600px; margin: 0 auto;
}
.game-view.active { display: block; }
.game-view .game-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.game-view .back-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 14px; transition: .2s;
}
.game-view .back-btn:hover { background: var(--accent); color: white; }
.game-view .game-title { font-size: 22px; font-weight: 700; flex: 1; }
.game-status {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.game-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.game-controls button {
  background: var(--accent); color: white; border: none;
  padding: 8px 18px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: .2s;
}
.game-controls button:hover { filter: brightness(1.15); }
.game-controls button.secondary {
  background: var(--surface2); color: var(--text);
}
.game-controls button.secondary:hover { background: var(--border); }
/* Game Board Container */
.board-wrap {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
  display: flex; justify-content: center;
}

/* Memory */
.memory-board { display: grid; gap: 8px; justify-content: center; }
.memory-card {
  width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; border-radius: 8px; cursor: pointer; transition: .2s;
  background: var(--accent); color: white; user-select: none;
}
.memory-card.flipped { background: var(--surface); border: 2px solid var(--accent); }
.memory-card.matched { background: var(--accent2); border-color: var(--accent2); cursor: default; opacity: .7; }
.memory-card:hover { transform: scale(1.05); }
@m
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="gameView" class="game-view active" style="display:block;max-width:600px;margin:0 auto;padding:20px"></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function toast(m,d){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';
  Object.assign(t.style,{position:'fixed',bottom:'30px',left:'50%',transform:'translateX(-50%)',
  background:'var(--accent)',color:'#fff',padding:'10px 24px',borderRadius:'24px',
  fontSize:'14px',fontWeight:'600',opacity:'0',transition:'opacity .3s',pointerEvents:'none',zIndex:'999'});document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',d||1500);
}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',d.dataset.theme);}
(function(){const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s;})();
function backToMenu(){window.location.href='index.html';}

function renderMemory(container) {
  const EMOJIS = ['🐶','🐱','🐼','🐨','🦊','🐸','🐵','🦄'];
  let cards = [], flipped = [], matched = new Set(), locked = false, moves = 0;

  container.innerHTML = `
    <div class="game-header">
      <button class="back-btn" onclick="backToMenu()">← 返回</button>
      <span class="game-title">🃏 记忆翻牌</span>
    </div>
    <div class="game-status">
      <span>🔄 <strong id="memMoves">0</strong> 步</span>
      <span>✅ <strong id="memMatched">0</strong>/${EMOJIS.length}</span>
      <div class="game-controls">
        <button onclick="newMem()">新游戏</button>
      </div>
    </div>
    <div class="board-wrap"><div id="memBoard" class="memory-board"></div></div>
  `;

  const shuffle = arr => {
    for (let i=arr.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  };

  const init = () => {
    cards = shuffle([...EMOJIS, ...EMOJIS]);
    flipped = []; matched = new Set(); locked = false; moves = 0;
    $('#memMoves').textContent = '0';
    $('#memMatched').textContent = '0';
    draw();
  };

  const draw = () => {
    const b = $('#memBoard');
    b.style.gridTemplateColumns = `repeat(4, 64px)`;
    b.innerHTML = '';
    cards.forEach((emoji, i) => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      if (matched.has(i)) { card.className += ' matched'; card.textContent = emoji; }
      else if (flipped.includes(i)) { card.className += ' flipped'; card.textContent = emoji; }
      else card.textContent = '❓';
      card.onclick = () => flipCard(i);
      b.appendChild(card);
    });
  };

  const flipCard = (i) => {
    if (locked || flipped.includes(i) || matched.has(i) || flipped.length >= 2) return;
    flipped.push(i);
    draw();
    if (flipped.length === 2) {
      moves++;
      $('#memMoves').textContent = moves;
      locked = true;
      const [a,b] = flipped;
      if (cards[a] === cards[b]) {
        matched.add(a); matched.add(b);
        flipped = []; locked = false;
        $('#memMatched').textContent = matched.size / 2;
        draw();
        if (matched.size === cards.length) toast('🎉 恭喜通关！共用 '+moves+' 步', 3000);
      } else {
        setTimeout(() => {
          flipped = []; locked = false;
          draw();
        }, 800);
      }
    }
  };

  window.newMem = init;
  init();
}
(function() {
  const v = document.getElementById('gameView');
  renderMemory(v);
  // Clean up duplicate toast
  if (v.querySelector('#toast')) v.querySelector('#toast').remove();
})();
</script>
</body>
</html>
