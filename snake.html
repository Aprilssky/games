<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇</title>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #252542;
  --text: #e0e0f0;
  --text2: #9292b0;
  --accent: #6c63ff;
  --accent2: #4ade80;
  --accent3: #f472b6;
  --border: #2a2a4a;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f0f0f5;
  --surface: #ffffff;
  --surface2: #e8e8f0;
  --text: #1a1a2e;
  --text2: #666680;
  --accent: #5b52e0;
  --border: #d0d0e0;
  --shadow: 0 4px 24px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; transition: background .3s;
}
/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 20px; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 8px;
  cursor: pointer; font-size: 18px; display: flex;
  align-items: center; justify-content: center; transition: .2s;
}
.theme-btn:hover { background: var(--accent); color: white; }
/* Game Grid */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; padding: 24px; max-width: 900px; margin: 0 auto;
}
.game-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; cursor: pointer;
  transition: all .25s; text-align: center;
  box-shadow: var(--shadow);
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 32px rgba(108,99,255,.25);
}
.game-card .icon { font-size: 48px; margin-bottom: 12px; }
.game-card h3 { font-size: 18px; margin-bottom: 8px; }
.game-card p { color: var(--text2); font-size: 14px; line-height: 1.5; }
/* Game View */
.game-view {
  display: none;
  padding: 20px; max-width: 600px; margin: 0 auto;
}
.game-view.active { display: block; }
.game-view .game-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.game-view .back-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 14px; transition: .2s;
}
.game-view .back-btn:hover { background: var(--accent); color: white; }
.game-view .game-title { font-size: 22px; font-weight: 700; flex: 1; }
.game-status {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.game-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.game-controls button {
  background: var(--accent); color: white; border: none;
  padding: 8px 18px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: .2s;
}
.game-controls button:hover { filter: brightness(1.15); }
.game-controls button.secondary {
  background: var(--surface2); color: var(--text);
}
.game-controls button.secondary:hover { background: var(--border); }
/* Game Board Container */
.board-wrap {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
  display: flex; justify-content: center;
}

/* Snake */
.snake-board-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.snake-board { display: grid; background: var(--surface2); border-radius: 4px; }
.snake-cell { width: 20px; height: 20px; }
.snake-cell.head { background: var(--accent2); border-radius: 3px; }
.snake-cell.body { background: #2dd4bf; border-radius: 3px; }
.snake-cell.food { background: var(--accent3); border-radius: 50%; }
.snake-controls {
  display: grid; grid-template-columns: 64px 64px 64px;
  grid-template-rows: 48px 48px; gap: 4px; margin-top: 8px;
  justify-content: center;
}
.snake-controls button {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 20px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.snake-controls button.up { grid-column: 2; grid-row: 1; }
.snake-controls button.left { grid-column: 1; grid-row: 2; }
.snake-controls button.down { grid-column: 2; grid-row: 2; }
.snake-controls button.right { grid-column: 3; grid-row: 2; }
.snake-controls button:active { background: var(--accent); }
/* Mobile */
@media(max-width:600px) {
  .game-grid { grid-template-columns: 1fr 1fr; padding: 12px; gap: 10px; }
  .game-card { padding: 16px; }
  .game-card .icon { font-size: 36px; }
  .game-card h3 { font-size: 15px; }
  .game-card p { font-size: 12px; }
  .sudoku-board td { width: 34px; height: 34px; font-size: 15px; }
  .mine-board td { width: 30px; height: 30px; font-size: 14px; }
  .match-board td { width: 36px; height: 36px; font-size: 18px; }
  .t2048-cell { width: 52px; height: 52px; font-size: 20px; }
  .snake-cell { width: 16px; height: 16px; }
}
@m
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="gameView" class="game-view active" style="display:block;max-width:600px;margin:0 auto;padding:20px"></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function toast(m,d){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';
  Object.assign(t.style,{position:'fixed',bottom:'30px',left:'50%',transform:'translateX(-50%)',
  background:'var(--accent)',color:'#fff',padding:'10px 24px',borderRadius:'24px',
  fontSize:'14px',fontWeight:'600',opacity:'0',transition:'opacity .3s',pointerEvents:'none',zIndex:'999'});document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',d||1500);
}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',d.dataset.theme);}
(function(){const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s;})();
function backToMenu(){window.location.href='index.html';}

function renderSnake(container) {
  const SIZE=20;
  let snake=[[10,10]], dir=[1,0], nextDir=[1,0], food=null, running=false, gameOver=false, score=0, interval=150, timer=null;

  container.innerHTML = `
    <div class="game-header">
      <button class="back-btn" onclick="backToMenu()">← 返回</button>
      <span class="game-title">🐍 贪吃蛇</span>
    </div>
    <div class="game-status">
      <span>📏 <strong id="snakeLen">1</strong></span>
      <div class="game-controls">
        <button id="snakeStartBtn">开始</button>
        <button class="secondary" onclick="newSnake()">重置</button>
      </div>
    </div>
    <div class="snake-board-wrap">
      <div id="snakeBoard" class="snake-board"></div>
      <div class="snake-controls">
        <button class="up" onpointerdown="snakeDir([0,-1])">⬆</button>
        <button class="left" onpointerdown="snakeDir([-1,0])">⬅</button>
        <button class="down" onpointerdown="snakeDir([0,1])">⬇</button>
        <button class="right" onpointerdown="snakeDir([1,0])">➡</button>
      </div>
    </div>
  `;

  const init = () => {
    if (timer) { clearInterval(timer); timer=null; }
    snake = [[10,10]]; dir = [1,0]; nextDir = [1,0]; running = false; gameOver = false; score = 0;
    food = null; spawnFood();
    $('#snakeStartBtn').textContent = '开始';
    draw();
  };

  const spawnFood = () => {
    const occupied = new Set(snake.map(([r,c])=>r+','+c));
    const empty = [];
    for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) if (!occupied.has(r+','+c)) empty.push([r,c]);
    if (empty.length) food = empty[Math.floor(Math.random()*empty.length)];
  };

  const draw = () => {
    const b = $('#snakeBoard');
    b.style.gridTemplateColumns = `repeat(${SIZE},20px)`;
    b.innerHTML = '';
    const cells = new Map();
    for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) {
      const div = document.createElement('div'); div.className = 'snake-cell'; div.dataset.r=r; div.dataset.c=c;
      b.appendChild(div); cells.set(r+','+c, div);
    }
    snake.forEach(([r,c],i) => {
      const d = cells.get(r+','+c);
      if (d) d.className = 'snake-cell ' + (i===0?'head':'body');
    });
    if (food) { const d = cells.get(food[0]+','+food[1]); if (d) d.className='snake-cell food'; }
    $('#snakeLen').textContent = snake.length;
  };

  const step = () => {
    if (gameOver) { if (timer) { clearInterval(timer); timer=null; } return; }
    dir = nextDir;
    const head = [snake[0][0]+dir[0], snake[0][1]+dir[1]];
    // Wall wrap
    if (head[0]<0||head[0]>=SIZE||head[1]<0||head[1]>=SIZE) { endGame(); return; }
    // Self collision
    if (snake.some(([r,c])=>r===head[0]&&c===head[1])) { endGame(); return; }
    snake.unshift(head);
    if (food && head[0]===food[0] && head[1]===food[1]) {
      score++; spawnFood();
      interval = Math.max(60, interval - 3);
      if (timer) { clearInterval(timer); timer=setInterval(step, interval); }
    } else snake.pop();
    draw();
  };

  const endGame = () => {
    gameOver = true; if (timer) { clearInterval(timer); timer=null; running=false; }
    $('#snakeStartBtn').textContent = '开始';
    toast('💀 游戏结束！长度：'+snake.length, 2000);
  };

  const toggleSnake = () => {
    if (gameOver) { init(); }
    if (running) { clearInterval(timer); timer=null; running=false; $('#snakeStartBtn').textContent = '继续'; }
    else { timer=setInterval(step, interval); running=true; $('#snakeStartBtn').textContent = '暂停'; }
  };

  window.snakeDir = (d) => {
    if (d[0] === -dir[0] && d[1] === -dir[1]) return;
    nextDir = d;
  };

  document.onkeydown=(e)=>{if(window._activeKeyHandler)_activeKeyHandler(e);};
_activeKeyHandler = (e) => {
    if (!$('#gameView').classList.contains('active')) return;
    if (!$('#snakeBoard')) return;
    const map = {
      ArrowUp:[0,-1], ArrowDown:[0,1],
      ArrowLeft:[-1,0], ArrowRight:[1,0],
      'w':[0,-1], 's':[0,1], 'a':[-1,0], 'd':[1,0], 'W':[0,-1], 'S':[0,1], 'A':[-1,0], 'D':[1,0],
    };
    if (map[e.key]) { e.preventDefault(); window.snakeDir(map[e.key]); }
    if (e.key === ' ') { e.preventDefault(); toggleSnake(); }
  };
  window.newSnake = init;

  document.getElementById('snakeStartBtn').onclick = toggleSnake;
  init();
}
(function() {
  const v = document.getElementById('gameView');
  renderSnake(v);
  // Clean up duplicate toast
  if (v.querySelector('#toast')) v.querySelector('#toast').remove();
})();
</script>
</body>
</html>
