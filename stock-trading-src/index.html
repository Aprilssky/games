<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟炒股 · 实盘训练</title>
<script src="vendor/lightweight-charts.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
:root{--bg:#0b0e14;--card:#141822;--card2:#1a1f2e;--text:#d1d4dc;--text2:#8a8f9e;--green:#0ecb81;--red:#ef5350;--blue:#2196f3;--yellow:#ffa726;--border:#262b38}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{max-width:920px;margin:0 auto;padding:10px 10px 40px}

/* ─── Header ─── */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-radius:12px;margin-bottom:8px}
.header-left{display:flex;align-items:center;gap:10px}
.header-left .logo{font-size:18px;font-weight:700}
.header-left .ticker{font-size:11px;color:var(--text2);background:var(--card2);padding:2px 8px;border-radius:4px;font-weight:600}
.header-right{text-align:right}
.price-row{display:flex;align-items:baseline;gap:12px;justify-content:flex-end}
.current-price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;transition:color .15s}
.price-change{font-size:14px;font-weight:600;padding:1px 8px;border-radius:4px}
.price-change.up{color:var(--green);background:rgba(14,203,129,.08)}
.price-change.down{color:var(--red);background:rgba(239,83,80,.08)}
.range-row{font-size:11px;color:var(--text2);margin-top:3px;display:flex;gap:16px;justify-content:flex-end}
.range-row span{font-variant-numeric:tabular-nums}

/* ─── Chart ─── */
#chart-wrapper{background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px}
#chart-container{width:100%;height:400px;border-radius:8px}

/* ─── Account Bar ─── */
.account-bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.account-card{background:var(--card);border-radius:10px;padding:8px 6px;text-align:center}
.account-card .label{font-size:10px;color:var(--text2);margin-bottom:2px;letter-spacing:0.3px}
.account-card .value{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.account-card .value.up{color:var(--green)}
.account-card .value.down{color:var(--red)}

/* ─── Trading Panel ─── */
.trading-panel{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.panel-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;position:relative}
.panel-row:last-child{margin-bottom:0}
.panel-label{font-size:12px;color:var(--text2);white-space:nowrap;min-width:48px}
.fee-input{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:14px;width:68px;text-align:center;outline:none;font-variant-numeric:tabular-nums}
.fee-input:focus{border-color:var(--blue)}
.pct-group{display:flex;gap:4px;flex-wrap:wrap}
.pct-btn{background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:5px 14px;font-size:13px;cursor:pointer;transition:all .15s;min-width:44px;font-weight:500}
.pct-btn:hover{border-color:var(--blue);color:var(--text)}
.pct-btn.active{border-color:var(--green);color:var(--green);background:rgba(14,203,129,.08);font-weight:600}
.qty-input{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:14px;width:88px;text-align:center;outline:none;font-variant-numeric:tabular-nums}
.qty-input:focus{border-color:var(--blue)}
.trade-btns{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;width:100%}
.btn{padding:9px 4px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;text-align:center;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-buy{background:linear-gradient(135deg,#0ecb81,#0abf77);color:#0b0e14}
.btn-buy:hover:not(:disabled){box-shadow:0 0 14px rgba(14,203,129,.3)}
.btn-sell{background:linear-gradient(135deg,#ef5350,#e53935);color:#fff}
.btn-sell:hover:not(:disabled){box-shadow:0 0 14px rgba(239,83,80,.3)}
.btn-cover-sell{background:rgba(239,83,80,.1);color:var(--red);border:1px solid rgba(239,83,80,.25)}
.btn-cover-sell:hover:not(:disabled){background:rgba(239,83,80,.2)}
.btn-cover-buy{background:rgba(14,203,129,.1);color:var(--green);border:1px solid rgba(14,203,129,.25)}
.btn-cover-buy:hover:not(:disabled){background:rgba(14,203,129,.2)}
.btn-reset{background:var(--card2);color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:5px 14px;font-size:12px;cursor:pointer;transition:all .15s}
.btn-reset:hover{color:var(--text);border-color:var(--text2)}
.hint-hotkey{font-size:10px;color:var(--text2);opacity:.5;display:inline-block;margin-left:2px}

/* ─── Positions ─── */
.positions-panel{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.section-title{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pos-empty{text-align:center;padding:14px 8px;color:var(--text2);font-size:13px}
.pos-table{width:100%;border-collapse:collapse;font-size:12px}
.pos-table th{text-align:left;padding:6px 6px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);font-size:11px}
.pos-table td{padding:6px 6px;border-bottom:1px solid rgba(38,43,56,.4);font-variant-numeric:tabular-nums}
.pos-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.pos-badge.long{background:rgba(14,203,129,.12);color:var(--green)}
.pos-badge.short{background:rgba(239,83,80,.12);color:var(--red)}

/* ─── Trades ─── */
.trades-panel{background:var(--card);border-radius:12px;padding:12px 14px}
.trade-list{max-height:180px;overflow-y:auto}
.trade-list::-webkit-scrollbar{width:4px}
.trade-list::-webkit-scrollbar-track{background:transparent}
.trade-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.trade-item{display:grid;grid-template-columns:52px 1fr auto;gap:6px;padding:5px 0;border-bottom:1px solid rgba(38,43,56,.4);font-size:12px;align-items:center}
.trade-item:last-child{border-bottom:none}
.trade-time{color:var(--text2);white-space:nowrap;font-size:11px}
.trade-desc{color:var(--text)}
.trade-detail{text-align:right;white-space:nowrap;font-size:11px;font-variant-numeric:tabular-nums}
.trade-pnl-up{color:var(--green)}
.trade-pnl-down{color:var(--red)}

/* ─── Toast ─── */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 22px;font-size:14px;z-index:999;opacity:0;transition:all .25s ease;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.6);max-width:90vw;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast.buy{background:linear-gradient(135deg,var(--card),rgba(14,203,129,.06));border-color:rgba(14,203,129,.2)}
.toast.sell{background:linear-gradient(135deg,var(--card),rgba(239,83,80,.06));border-color:rgba(239,83,80,.2)}

/* ─── Shortcut hint ─── */
.shortcut-hint{background:var(--card);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:11px;color:var(--text2);display:flex;flex-wrap:wrap;gap:6px 16px}
.shortcut-hint kbd{background:var(--card2);border:1px solid var(--border);padding:1px 6px;border-radius:3px;font-size:10px;color:var(--text)}

/* ─── Responsive ─── */
@media(max-width:640px){
  .app{padding:6px}
  .header{padding:8px 10px}
  .header-left .logo{font-size:15px}
  .current-price{font-size:22px}
  .account-bar{grid-template-columns:1fr 1fr}
  .account-card .value{font-size:14px}
  #chart-container{height:260px}
  .trade-btns{grid-template-columns:1fr 1fr}
  .btn{font-size:11px;padding:8px 4px}
  .panel-row{gap:6px}
}
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <span class="logo">📈 模拟炒股</span>
      <span class="ticker">SIM</span>
    </div>
    <div class="header-right">
      <div class="price-row">
        <span class="current-price" id="curPrice">100.00</span>
        <span class="price-change" id="priceChg">+0.00%</span>
      </div>
      <div class="range-row">
        <span>高 <b id="highPrice">100.00</b></span>
        <span>低 <b id="lowPrice">100.00</b></span>
        <span>成交量 <b id="volumeDisp">0</b></span>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div id="chart-wrapper">
    <div id="chart-container"></div>
  </div>

  <!-- Account -->
  <div class="account-bar">
    <div class="account-card">
      <div class="label">总资产</div>
      <div class="value" id="totalEquity">¥10,000.00</div>
    </div>
    <div class="account-card">
      <div class="label">可用资金</div>
      <div class="value" id="availCash">¥10,000.00</div>
    </div>
    <div class="account-card">
      <div class="label">浮动盈亏</div>
      <div class="value" id="unrealPnL">¥0.00</div>
    </div>
    <div class="account-card">
      <div class="label">持仓市值</div>
      <div class="value" id="positionValue">¥0.00</div>
    </div>
  </div>

  <!-- Trading Panel -->
  <div class="trading-panel">
    <div class="panel-row">
      <span class="panel-label">手续费</span>
      <input class="fee-input" id="feeRate" type="number" value="0.10" step="0.01" min="0" max="5">
      <span style="font-size:11px;color:var(--text2)">%</span>
      <span style="margin-left:auto;font-size:12px;color:var(--text2)">
        现价 <b style="color:var(--text);font-variant-numeric:tabular-nums" id="tradePrice">100.00</b>
      </span>
      <span style="font-size:11px;color:var(--text2)">
        <kbd style="background:var(--card2);padding:1px 5px;border-radius:3px;font-size:10px">B</kbd>做多
        <kbd style="background:var(--card2);padding:1px 5px;border-radius:3px;font-size:10px">S</kbd>做空
      </span>
    </div>
    <div class="panel-row">
      <span class="panel-label">仓位</span>
      <div class="pct-group" id="pctGroup">
        <button class="pct-btn" data-pct="25">25%</button>
        <button class="pct-btn" data-pct="50">50%</button>
        <button class="pct-btn" data-pct="75">75%</button>
        <button class="pct-btn active" data-pct="100">全仓</button>
      </div>
      <span style="font-size:11px;color:var(--text2)">或</span>
      <input class="qty-input" id="qtyInput" type="number" value="" min="1" step="1" placeholder="数量">
      <span style="font-size:11px;color:var(--text2)">股</span>
      <span style="margin-left:auto;display:flex;gap:4px">
        <button class="btn-reset" id="btnReset" title="重置模拟 Ctrl+R">↻ 重置</button>
      </span>
    </div>
    <div class="panel-row">
      <div class="trade-btns" id="tradeButtons">
        <button class="btn btn-buy" id="btnBuy">🟢 买入做多</button>
        <button class="btn btn-sell" id="btnShort">🔴 卖出做空</button>
        <button class="btn btn-cover-sell" id="btnSell">📤 平多做空</button>
        <button class="btn btn-cover-buy" id="btnCover">📥 平空做多</button>
      </div>
    </div>
  </div>

  <!-- Positions -->
  <div class="positions-panel">
    <div class="section-title">📋 持仓</div>
    <div id="posContent">
      <div class="pos-empty">暂无持仓 — 开始交易吧</div>
    </div>
  </div>

  <!-- Trades -->
  <div class="trades-panel">
    <div class="section-title">📜 交易记录</div>
    <div class="trade-list" id="tradeList">
      <div class="pos-empty" style="padding:8px">暂无交易</div>
    </div>
  </div>

  <!-- Shortcut hints -->
  <div class="shortcut-hint">
    <span><kbd>B</kbd> 买入做多</span>
    <span><kbd>S</kbd> 卖出做空</span>
    <span><kbd>Q</kbd> 平多做空</span>
    <span><kbd>W</kbd> 平空做多</span>
    <span><kbd>1</kbd>–<kbd>4</kbd> 仓位比例</span>
    <span><kbd>R</kbd> 重置</span>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  Configuration
// ═══════════════════════════════════════════════════
const CFG = {
  basePrice: 100,
  initialCash: 10000,
  volatility: 0.0035,
  drift: 0.00002,
  meanReversion: 0.0003,
  updateMs: 1000,
  candleSec: 60,
  initialCandles: 12,
};

// ═══════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════
const S = {
  price: CFG.basePrice,
  cash: CFG.initialCash,
  longQty: 0,
  longCost: 0,
  shortQty: 0,
  shortCost: 0,
  feeRate: 0.001,
  positionPct: 100,
  trades: [],
  markers: [],
  high: CFG.basePrice,
  low: CFG.basePrice,
  volume: 0,
  candles: [],
  currentCandle: null,
  frame: 0,
};

// ═══════════════════════════════════════════════════
//  Chart
// ═══════════════════════════════════════════════════
const chart = LightweightCharts.createChart(
  document.getElementById('chart-container'),
  {
    layout: {
      textColor: '#7a7f8e',
      background: { type: 'solid', color: '#141822' },
    },
    grid: {
      vertLines: { color: '#1a2030' },
      horzLines: { color: '#1a2030' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: {
      borderColor: '#262b38',
      timeVisible: true,
      secondsVisible: false,
      tickMarkFormatter: (t) => {
        const d = new Date(t * 1000);
        return String(d.getHours()).padStart(2,'0') + ':' +
               String(d.getMinutes()).padStart(2,'0');
      },
    },
    rightPriceScale: { borderColor: '#262b38' },
  }
);

const candleSeries = chart.addCandlestickSeries({
  upColor: '#0ecb81',
  downColor: '#ef5350',
  borderUpColor: '#0ecb81',
  borderDownColor: '#ef5350',
  wickUpColor: '#0ecb81',
  wickDownColor: '#ef5350',
});

// Volume histogram (bottom 15% of chart)
const volSeries = chart.addHistogramSeries({
  color: '#0ecb8155',
  priceFormat: { type: 'volume' },
  priceScaleId: 'vol-scale',
});
chart.priceScale('vol-scale').applyOptions({
  scaleMargins: { top: 0.83, bottom: 0 },
});

// Dashed line for current candle's close price
const markerLine = chart.addLineSeries({
  color: '#d1d4dc55',
  lineWidth: 1,
  lineStyle: LightweightCharts.LineStyle.Dashed,
  lastValueVisible: false,
  priceLineVisible: false,
  autoscaleInfoProvider: () => null,
});

// ═══════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════
function gaussRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function getCandleTS() {
  return Math.floor(Date.now() / 1000 / CFG.candleSec) * CFG.candleSec;
}

function fmt(v)  { return (v >= 0 ? '+' : '') + v.toFixed(2); }
function fmt$(v) { return (v >= 0 ? '+' : '') + '¥' + v.toFixed(2); }

// ═══════════════════════════════════════════════════
//  Price Generator
// ═══════════════════════════════════════════════════
function nextPrice() {
  const noise = gaussRandom() * CFG.volatility * S.price;
  const drift = CFG.drift * S.price;
  const reversion = (CFG.basePrice - S.price) * CFG.meanReversion;
  S.price += noise + drift + reversion;
  if (S.price < 0.01) S.price = 0.01;

  // Occasional spike
  if (Math.random() < 0.003) {
    S.price += gaussRandom() * CFG.volatility * 4 * S.price;
    if (S.price < 0.01) S.price = 0.01;
  }
  return S.price;
}

// ═══════════════════════════════════════════════════
//  Candle Engine
// ═══════════════════════════════════════════════════
function updateCandle(price, vol) {
  const ts = getCandleTS();

  if (!S.currentCandle || S.currentCandle.t !== ts) {
    // === Close previous candle ===
    if (S.currentCandle) {
      S.currentCandle.c = price;
      S.candles.push(S.currentCandle);
      // Push finished candle to series (will update if exists)
      candleSeries.update({
        time: S.currentCandle.t,
        open: S.currentCandle.o,
        high: S.currentCandle.h,
        low: S.currentCandle.l,
        close: S.currentCandle.c,
      });
      // Volume for finished candle
      const vc = S.currentCandle.c >= S.currentCandle.o
        ? '#0ecb8133' : '#ef535033';
      volSeries.update({
        time: S.currentCandle.t,
        value: Math.max(S.currentCandle.vol, 0.5),
        color: vc,
      });
    }

    // === Start new candle ===
    S.currentCandle = {
      t: ts,
      o: price,
      h: price,
      l: price,
      c: price,
      vol: 0,
    };
  }

  // Update current candle
  if (price > S.currentCandle.h) S.currentCandle.h = price;
  if (price < S.currentCandle.l) S.currentCandle.l = price;
  S.currentCandle.c = price;
  if (vol > 0) S.currentCandle.vol += vol;

  // Push live candle to chart
  candleSeries.update({
    time: S.currentCandle.t,
    open: S.currentCandle.o,
    high: S.currentCandle.h,
    low: S.currentCandle.l,
    close: S.currentCandle.c,
  });
  volSeries.update({
    time: S.currentCandle.t,
    value: Math.max(S.currentCandle.vol, 0.5),
    color: S.currentCandle.c >= S.currentCandle.o
      ? '#0ecb8133' : '#ef535033',
  });
}

// ═══════════════════════════════════════════════════
//  Generate Initial Candles
// ═══════════════════════════════════════════════════
function generateInitialData() {
  const nowSec = Math.floor(Date.now() / 1000);
  const startSec = nowSec - CFG.initialCandles * CFG.candleSec;

  // Walk price forward from a starting value
  let p = CFG.basePrice * (0.92 + Math.random() * 0.08);
  const totalSteps = CFG.initialCandles * CFG.candleSec;

  const histPrices = [];
  for (let i = 0; i < totalSteps; i++) {
    const noise = gaussRandom() * CFG.volatility * p;
    const rev = (CFG.basePrice - p) * CFG.meanReversion;
    p += noise + rev;
    if (p < 0.01) p = 0.01;
    histPrices.push(p);
  }

  S.price = histPrices[histPrices.length - 1];

  // Build candles from history
  const candleData = [];
  const volData = [];
  for (let i = 0; i < CFG.initialCandles; i++) {
    const start = i * CFG.candleSec;
    const chunk = histPrices.slice(start, start + CFG.candleSec);
    if (chunk.length === 0) continue;

    const ts = startSec + i * CFG.candleSec;
    const o = chunk[0];
    const h = Math.max(...chunk);
    const l = Math.min(...chunk);
    const c = chunk[chunk.length - 1];
    const v = Math.floor(Math.random() * 80) + 10;

    const candle = { t: ts, o, h, l, c, vol: v };
    S.candles.push(candle);
    candleData.push({ time: ts, open: o, high: h, low: l, close: c });
    volData.push({
      time: ts,
      value: v,
      color: c >= o ? '#0ecb8133' : '#ef535033',
    });
  }

  // Update high/low
  S.high = Math.max(...histPrices);
  S.low = Math.min(...histPrices);

  // Set current candle from last price
  const curTS = getCandleTS();
  S.currentCandle = {
    t: curTS,
    o: S.price,
    h: S.price,
    l: S.price,
    c: S.price,
    vol: 0,
  };
  candleData.push({ time: curTS, open: S.price, high: S.price, low: S.price, close: S.price });

  // Push to chart
  candleSeries.setData(candleData);
  volSeries.setData(volData);

  chart.timeScale().fitContent();
  chart.timeScale().scrollToRealTime();
}

// ═══════════════════════════════════════════════════
//  Trading Engine
// ═══════════════════════════════════════════════════
function getFee() { return S.feeRate; }

function buyLong(price, qty, fee) {
  if (qty <= 0) return { ok: false, msg: '数量必须大于 0' };
  const cost = price * qty;
  const feeAmt = cost * fee;
  const total = cost + feeAmt;
  if (total > S.cash) {
    return { ok: false, msg: `资金不足 — 需 ¥${total.toFixed(2)}，可用 ¥${S.cash.toFixed(2)}` };
  }
  const prevTotalCost = S.longQty * S.longCost + cost + feeAmt;
  S.longQty += qty;
  S.longCost = prevTotalCost / S.longQty;
  S.cash -= total;
  S.trades.unshift({ type: '买入做多', price, qty, fee: feeAmt, pnl: null, time: Date.now() });
  S.markers.push({ time: getCandleTS(), position: 'belowBar', shape: 'arrowUp', color: '#0ecb81', text: 'B' });
  S.volume += qty;
  return { ok: true, msg: `买入做多 ${qty}股 @ ¥${price.toFixed(2)}` };
}

function sellShort(price, qty, fee) {
  if (qty <= 0) return { ok: false, msg: '数量必须大于 0' };
  const value = price * qty;
  const feeAmt = value * fee;
  const received = value - feeAmt;
  // Margin: need 20% of short value in cash
  if (S.cash < value * 0.2) {
    return { ok: false, msg: `保证金不足 — 需 ¥${(value * 0.2).toFixed(2)}` };
  }
  S.cash += received;
  const prevTotal = S.shortQty * S.shortCost + value;
  S.shortQty += qty;
  S.shortCost = prevTotal / S.shortQty;
  S.trades.unshift({ type: '卖出做空', price, qty, fee: feeAmt, pnl: null, time: Date.now() });
  S.markers.push({ time: getCandleTS(), position: 'aboveBar', shape: 'arrowDown', color: '#ef5350', text: 'S' });
  S.volume += qty;
  return { ok: true, msg: `卖出做空 ${qty}股 @ ¥${price.toFixed(2)}` };
}

function closeLong(price, qty, fee) {
  if (S.longQty <= 0) return { ok: false, msg: '没有做多持仓' };
  qty = Math.min(qty, S.longQty);
  if (qty <= 0) return { ok: false, msg: '数量必须大于 0' };
  const value = price * qty;
  const feeAmt = value * fee;
  const pnl = (price - S.longCost) * qty - feeAmt;
  S.cash += value - feeAmt;
  S.longQty -= qty;
  if (S.longQty === 0) S.longCost = 0;
  S.trades.unshift({ type: '平多做空', price, qty, fee: feeAmt, pnl, time: Date.now() });
  S.markers.push({ time: getCandleTS(), position: 'inBar', shape: 'square', color: pnl >= 0 ? '#0ecb81' : '#ef5350', text: '平多' });
  return { ok: true, msg: `平多做空 ${qty}股 @ ¥${price.toFixed(2)} 盈亏 ${fmt$(pnl)}` };
}

function closeShort(price, qty, fee) {
  if (S.shortQty <= 0) return { ok: false, msg: '没有做空持仓' };
  qty = Math.min(qty, S.shortQty);
  if (qty <= 0) return { ok: false, msg: '数量必须大于 0' };
  const cost = price * qty;
  const feeAmt = cost * fee;
  const total = cost + feeAmt;
  if (total > S.cash) {
    return { ok: false, msg: `资金不足 — 需 ¥${total.toFixed(2)}，可用 ¥${S.cash.toFixed(2)}` };
  }
  const pnl = (S.shortCost - price) * qty - feeAmt;
  S.cash -= total;
  S.shortQty -= qty;
  if (S.shortQty === 0) S.shortCost = 0;
  S.trades.unshift({ type: '平空做多', price, qty, fee: feeAmt, pnl, time: Date.now() });
  S.markers.push({ time: getCandleTS(), position: 'inBar', shape: 'square', color: pnl >= 0 ? '#0ecb81' : '#ef5350', text: '平空' });
  return { ok: true, msg: `平空做多 ${qty}股 @ ¥${price.toFixed(2)} 盈亏 ${fmt$(pnl)}` };
}

function calcMaxQty(price) {
  const fee = getFee();
  return Math.floor(S.cash / (price * (1 + fee)));
}

function calcPctQty(pct, price) {
  return Math.floor(calcMaxQty(price) * pct / 100);
}

// ═══════════════════════════════════════════════════
//  P&L
// ═══════════════════════════════════════════════════
function unrealizedPnL(price) {
  return (price - S.longCost) * S.longQty + (S.shortCost - price) * S.shortQty;
}

function posValue(price) {
  return S.longQty * price - S.shortQty * price;
}

function totalEquity(price) {
  return S.cash + posValue(price);
}

// ═══════════════════════════════════════════════════
//  UI Updates
// ═══════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function updateUI() {
  const p = S.price;
  const o = S.currentCandle ? S.currentCandle.o : p;
  const chg = o > 0 ? (p - o) / o * 100 : 0;
  const eq = totalEquity(p);
  const pnl = unrealizedPnL(p);

  // Price header
  $('curPrice').textContent = p.toFixed(2);
  $('curPrice').style.color = chg >= 0 ? 'var(--green)' : 'var(--red)';
  $('priceChg').textContent = fmt(chg) + '%';
  $('priceChg').className = 'price-change ' + (chg >= 0 ? 'up' : 'down');
  $('highPrice').textContent = S.high.toFixed(2);
  $('lowPrice').textContent = S.low.toFixed(2);
  $('volumeDisp').textContent = S.volume;

  // Account bar
  $('totalEquity').textContent = '¥' + eq.toFixed(2);
  $('totalEquity').className = 'value ' + (eq >= CFG.initialCash ? 'up' : 'down');
  $('availCash').textContent = '¥' + S.cash.toFixed(2);
  $('unrealPnL').textContent = fmt$(pnl);
  $('unrealPnL').className = 'value ' + (pnl >= 0 ? 'up' : 'down');
  $('positionValue').textContent = '¥' + posValue(p).toFixed(2);

  // Trade panel
  $('tradePrice').textContent = p.toFixed(2);
  $('tradePrice').style.color = chg >= 0 ? 'var(--green)' : 'var(--red)';

  // Marker line on chart
  markerLine.setData([
    { time: S.currentCandle ? S.currentCandle.t : getCandleTS(), value: p },
  ]);
}

function updateMarkers() {
  const active = S.markers.slice(-100);
  candleSeries.setMarkers(active);
}

function updatePositions() {
  const p = S.price;
  const hasLong  = S.longQty > 0;
  const hasShort = S.shortQty > 0;

  if (!hasLong && !hasShort) {
    $('posContent').innerHTML =
      '<div class="pos-empty">暂无持仓 — 开始交易吧</div>';
    return;
  }

  let html = '<table class="pos-table">' +
    '<tr><th>方向</th><th>数量(股)</th><th>均价</th><th>现价</th><th>盈亏</th><th>收益率</th></tr>';

  if (hasLong) {
    const pnl = (p - S.longCost) * S.longQty;
    const ret = S.longCost > 0 ? (p - S.longCost) / S.longCost * 100 : 0;
    html += `<tr>
      <td><span class="pos-badge long">做多</span></td>
      <td>${S.longQty}</td>
      <td>${S.longCost.toFixed(2)}</td>
      <td>${p.toFixed(2)}</td>
      <td style="color:${pnl>=0?'var(--green)':'var(--red)'}">${fmt$(pnl)}</td>
      <td style="color:${ret>=0?'var(--green)':'var(--red)'}">${fmt(ret)}%</td>
    </tr>`;
  }

  if (hasShort) {
    const pnl = (S.shortCost - p) * S.shortQty;
    const ret = S.shortCost > 0 ? (S.shortCost - p) / S.shortCost * 100 : 0;
    html += `<tr>
      <td><span class="pos-badge short">做空</span></td>
      <td>${S.shortQty}</td>
      <td>${S.shortCost.toFixed(2)}</td>
      <td>${p.toFixed(2)}</td>
      <td style="color:${pnl>=0?'var(--green)':'var(--red)'}">${fmt$(pnl)}</td>
      <td style="color:${ret>=0?'var(--green)':'var(--red)'}">${fmt(ret)}%</td>
    </tr>`;
  }

  html += '</table>';
  $('posContent').innerHTML = html;
}

function updateTrades() {
  if (S.trades.length === 0) {
    $('tradeList').innerHTML =
      '<div class="pos-empty" style="padding:8px">暂无交易</div>';
    return;
  }

  let html = '';
  S.trades.slice(0, 40).forEach(t => {
    const d = new Date(t.time);
    const timeStr =
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0') + ':' +
      String(d.getSeconds()).padStart(2,'0');
    let detail = `${t.qty}股 @ ¥${t.price.toFixed(2)}`;
    if (t.fee > 0) detail += ` 手续费¥${t.fee.toFixed(2)}`;
    const pnlStr = (t.pnl !== null)
      ? `<span class="${t.pnl >= 0 ? 'trade-pnl-up' : 'trade-pnl-down'}">${fmt$(t.pnl)}</span>`
      : '';
    html += `<div class="trade-item">
      <span class="trade-time">${timeStr}</span>
      <span class="trade-desc">${t.type}</span>
      <span class="trade-detail">${detail} ${pnlStr}</span>
    </div>`;
  });
  $('tradeList').innerHTML = html;
}

// ═══════════════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, type) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════
//  Actions
// ═══════════════════════════════════════════════════
function getQty() {
  // 如果有仓位按钮激活，按当前实时价格重新计算
  const activePct = document.querySelector('.pct-btn.active');
  if (activePct) {
    const pct = parseInt(activePct.dataset.pct);
    return calcPctQty(pct, S.price);
  }
  // 用户手动输入数量
  const manual = parseInt($('qtyInput').value);
  return manual > 0 ? manual : 0;
}

function actionBuy() {
  const p = S.price;
  const q = getQty();
  if (q <= 0) { showToast('请输入数量', 'sell'); return; }
  const r = buyLong(p, q, getFee());
  showToast(r.msg, r.ok ? 'buy' : 'sell');
  if (r.ok) { updatePositions(); updateTrades(); updateMarkers(); updateUI(); }
}

function actionShort() {
  const p = S.price;
  const q = getQty();
  if (q <= 0) { showToast('请输入数量', 'sell'); return; }
  const r = sellShort(p, q, getFee());
  showToast(r.msg, r.ok ? 'sell' : '');
  if (r.ok) { updatePositions(); updateTrades(); updateMarkers(); updateUI(); }
}

function actionSell() {
  if (S.longQty <= 0) { showToast('没有做多持仓', 'sell'); return; }
  const p = S.price;
  const r = closeLong(p, S.longQty, getFee());
  showToast(r.msg, r.ok ? (r.msg.includes('+' + (p >= S.longCost ? '' : '')) ? 'buy' : 'sell') : '');
  if (r.ok) { updatePositions(); updateTrades(); updateMarkers(); updateUI(); }
}

function actionCover() {
  if (S.shortQty <= 0) { showToast('没有做空持仓', 'buy'); return; }
  const p = S.price;
  const r = closeShort(p, S.shortQty, getFee());
  showToast(r.msg, r.ok ? 'buy' : '');
  if (r.ok) { updatePositions(); updateTrades(); updateMarkers(); updateUI(); }
}

function resetAll() {
  if (S.trades.length > 0 && S.cash < CFG.initialCash) {
    if (!confirm('确定重置？所有交易数据和持仓将被清空。')) return;
  }

  // Reset state
  S.cash = CFG.initialCash;
  S.longQty = 0; S.longCost = 0;
  S.shortQty = 0; S.shortCost = 0;
  S.trades = [];
  S.markers = [];
  S.volume = 0;
  S.candles = [];
  S.currentCandle = null;
  S.price = CFG.basePrice;
  S.high = CFG.basePrice;
  S.low = CFG.basePrice;
  S.frame = 0;

  // Clear chart
  candleSeries.setData([]);
  candleSeries.setMarkers([]);
  volSeries.setData([]);
  markerLine.setData([]);

  // Regenerate data
  generateInitialData();

  updateUI();
  updatePositions();
  updateTrades();
  showToast('🔄 已重置，初始资金 ¥10,000', 'buy');
}

// ═══════════════════════════════════════════════════
//  Main Loop
// ═══════════════════════════════════════════════════
function tick() {
  S.frame++;
  const p = nextPrice();

  // Track high/low
  if (p > S.high) S.high = p;
  if (p < S.low)  S.low  = p;

  // Mock volume
  const hasPos = S.longQty > 0 || S.shortQty > 0;
  const vol = hasPos ? Math.floor(Math.random() * 6) + 1 : Math.floor(Math.random() * 2);

  updateCandle(p, vol);

  // Auto scroll chart
  chart.timeScale().scrollToRealTime();

  // Full UI refresh
  updateUI();
  updatePositions();
  updateTrades();
}

// ═══════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════
generateInitialData();
updateUI();
updatePositions();
updateTrades();
setInterval(tick, CFG.updateMs);

// ═══════════════════════════════════════════════════
//  Events
// ═══════════════════════════════════════════════════
$('btnBuy').addEventListener('click', actionBuy);
$('btnShort').addEventListener('click', actionShort);
$('btnSell').addEventListener('click', actionSell);
$('btnCover').addEventListener('click', actionCover);
$('btnReset').addEventListener('click', resetAll);

// Fee
$('feeRate').addEventListener('input', function() {
  S.feeRate = parseFloat(this.value) / 100 || 0;
});

// Percentage buttons
document.querySelectorAll('.pct-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.pct-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    S.positionPct = parseInt(this.dataset.pct);
    // Preview qty
    const q = calcPctQty(S.positionPct, S.price);
    if (q > 0) $('qtyInput').value = q;
  });
});

// Custom qty removes pct selection
$('qtyInput').addEventListener('input', function() {
  if (parseInt(this.value) > 0) {
    document.querySelectorAll('.pct-btn').forEach(b => b.classList.remove('active'));
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key) {
    case 'b': case 'B': actionBuy(); break;
    case 's': case 'S': actionShort(); break;
    case 'q': case 'Q': actionSell(); break;
    case 'w': case 'W': actionCover(); break;
    case '1': document.querySelector('[data-pct="25"]')?.click(); break;
    case '2': document.querySelector('[data-pct="50"]')?.click(); break;
    case '3': document.querySelector('[data-pct="75"]')?.click(); break;
    case '4': document.querySelector('[data-pct="100"]')?.click(); break;
    case 'r': case 'R': resetAll(); break;
  }
});

// Resize handler
window.addEventListener('resize', () => {
  chart.applyOptions({
    width: document.getElementById('chart-container').clientWidth,
  });
});

// Initial qty preview
const initQty = calcPctQty(100, S.price);
if (initQty > 0) $('qtyInput').value = initQty;

console.log('📈 模拟炒股已启动');
console.log('快捷键: B=买入 S=做空 Q=平多做空 W=平空做多');
console.log('        1-4=仓位比例(25/50/75/100) R=重置');
</script>
