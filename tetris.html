<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧱 俄罗斯方块</title>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #252542;
  --text: #e0e0f0;
  --text2: #9292b0;
  --accent: #6c63ff;
  --accent2: #4ade80;
  --accent3: #f472b6;
  --border: #2a2a4a;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f0f0f5;
  --surface: #ffffff;
  --surface2: #e8e8f0;
  --text: #1a1a2e;
  --text2: #666680;
  --accent: #5b52e0;
  --border: #d0d0e0;
  --shadow: 0 4px 24px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; transition: background .3s;
}
/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 20px; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 8px;
  cursor: pointer; font-size: 18px; display: flex;
  align-items: center; justify-content: center; transition: .2s;
}
.theme-btn:hover { background: var(--accent); color: white; }
/* Game Grid */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; padding: 24px; max-width: 900px; margin: 0 auto;
}
.game-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; cursor: pointer;
  transition: all .25s; text-align: center;
  box-shadow: var(--shadow);
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 32px rgba(108,99,255,.25);
}
.game-card .icon { font-size: 48px; margin-bottom: 12px; }
.game-card h3 { font-size: 18px; margin-bottom: 8px; }
.game-card p { color: var(--text2); font-size: 14px; line-height: 1.5; }
/* Game View */
.game-view {
  display: none;
  padding: 20px; max-width: 600px; margin: 0 auto;
}
.game-view.active { display: block; }
.game-view .game-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.game-view .back-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 14px; transition: .2s;
}
.game-view .back-btn:hover { background: var(--accent); color: white; }
.game-view .game-title { font-size: 22px; font-weight: 700; flex: 1; }
.game-status {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.game-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.game-controls button {
  background: var(--accent); color: white; border: none;
  padding: 8px 18px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: .2s;
}
.game-controls button:hover { filter: brightness(1.15); }
.game-controls button.secondary {
  background: var(--surface2); color: var(--text);
}
.game-controls button.secondary:hover { background: var(--border); }
/* Game Board Container */
.board-wrap {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
  display: flex; justify-content: center;
}

/* Tetris */
.tetris-wrap { display: flex; gap: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.tetris-board { display: grid; gap: 1px; background: var(--border); border-radius: 4px; padding: 1px; }
.tetris-cell { width: 28px; height: 28px; border-radius: 2px; }
.tetris-cell.I { background: #00f0f0; }
.tetris-cell.O { background: #f0f000; }
.tetris-cell.T { background: #a000f0; }
.tetris-cell.S { background: #00f000; }
.tetris-cell.Z { background: #f00000; }
.tetris-cell.J { background: #0000f0; }
.tetris-cell.L { background: #f0a000; }
.tetris-cell.ghost { background: rgba(255,255,255,.1); border: 1px dashed rgba(255,255,255,.2); }
.tetris-side { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.tetris-next { display: grid; gap: 1px; background: var(--border); border-radius: 4px; padding: 1px; }
.tetris-next .tetris-cell { width: 22px; height: 22px; }
.tetris-score { font-size: 18px; font-weight: 700; text-align: center; }
.tetris-controls { display: grid; grid-template-columns: 44px 44px 44px; gap: 4px; justify-content: center; margin-top: 8px; }
.tetris-controls button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 44px; }
.tetris-controls button:active { background: var(--accent); }
@media(max-width:500px) {
  .tetris-cell { width: 22px; height: 22px; }
  .tetris-next .tetris-cell { width: 18px; height: 18px; }
}
@m
.toast { opacity: 0; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="gameView" class="game-view active" style="display:block;max-width:600px;margin:0 auto;padding:20px"></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function toast(m,d){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';
  Object.assign(t.style,{position:'fixed',bottom:'30px',left:'50%',transform:'translateX(-50%)',
  background:'var(--accent)',color:'#fff',padding:'10px 24px',borderRadius:'24px',
  fontSize:'14px',fontWeight:'600',opacity:'0',transition:'opacity .3s',pointerEvents:'none',zIndex:'999'});document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',d||1500);
}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',d.dataset.theme);}
(function(){const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s;})();
function backToMenu(){window.location.href='index.html';}

function renderTetris(container) {
  const COLS=10, ROWS=20, SIZE=28;
  const SHAPES = [
    {cells:[[1,1,1,1]],color:'I'},
    {cells:[[1,1],[1,1]],color:'O'},
    {cells:[[0,1,0],[1,1,1]],color:'T'},
    {cells:[[0,1,1],[1,1,0]],color:'S'},
    {cells:[[1,1,0],[0,1,1]],color:'Z'},
    {cells:[[1,0,0],[1,1,1]],color:'J'},
    {cells:[[0,0,1],[1,1,1]],color:'L'},
  ];
  let board=[], piece=null, next=null, score=0, gameOver=false, timer=null, dropInterval=500;

  function randPiece() { return {...SHAPES[Math.random()*SHAPES.length|0], x:3, y:0}; }
  function rotate(cells) {
    const n=cells.length, m=cells[0].length;
    return Array.from({length:m},(_,c)=>Array.from({length:n},(_,r)=>cells[n-1-r][c]));
  }
  function valid(p, offX=0, offY=0) {
    for (let r=0; r<p.cells.length; r++) for (let c=0; c<p.cells[0].length; c++) {
      if (!p.cells[r][c]) continue;
      const nx=p.x+c+offX, ny=p.y+r+offY;
      if (nx<0||nx>=COLS||ny>=ROWS) return false;
      if (ny>=0 && board[ny][nx]) return false;
    }
    return true;
  }
  function lock() {
    for (let r=0; r<piece.cells.length; r++) for (let c=0; c<piece.cells[0].length; c++) {
      if (!piece.cells[r][c]) continue;
      const ny=piece.y+r;
      if (ny>=0) board[ny][piece.x+c]=piece.color;
    }
    // Clear lines
    let cleared=0;
    for (let r=ROWS-1; r>=0; r--) {
      if (board[r].every(c=>c)) { board.splice(r,1); board.unshift(Array(COLS).fill(0)); cleared++; r++; }
    }
    if (cleared) score+=[0,100,300,500,800][cleared];
    spawnPiece();
    draw();
  }
  function spawnPiece() {
    piece=next||randPiece();
    next=randPiece();
    if (!valid(piece)) { gameOver=true; clearInterval(timer); timer=null; draw(); toast('😵 Game Over! 得分:'+score,2000); }
    draw();
  }
  function drop() { if(!gameOver){if(valid(piece,0,1)){piece.y++;draw();}else lock();} }
  function movePiece(dx){if(!gameOver&&valid(piece,dx,0)){piece.x+=dx;draw();}}
  function rotPiece(){if(gameOver)return;const r=rotate(piece.cells);const old=piece.cells;piece.cells=r;if(!valid(piece))piece.cells=old;draw();}
  function hardDrop(){if(gameOver)return;while(valid(piece,0,1))piece.y++;lock();}

  function draw() {
    const cont=container;
    // Board
    const b=cont.querySelector('.tetris-board');
    b.style.gridTemplateColumns='repeat('+COLS+','+SIZE+'px)';
    b.innerHTML='';
    const ghostY=(()=>{let g=piece.y;while(valid({...piece,y:g},0,1))g++;return g;})();
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');cell.className='tetris-cell';
      let color=board[r][c];
      if(!color&&piece&&r>=piece.y&&r<piece.y+piece.cells.length&&c>=piece.x&&c<piece.x+piece.cells[0].length){
        const pc=piece.cells[r-piece.y][c-piece.x];
        if(pc)color=piece.color;
        else if(r>=ghostY-piece.cells.length+1&&r<=ghostY&&c>=piece.x&&c<piece.x+piece.cells[0].length){
          const gc=piece.cells[r-ghostY+piece.cells.length-1-(ghostY-piece.y)][c-piece.x];
          if(gc&&!board[r][c])cell.className+=' ghost';
        }
      }
      if(color&&color!==true)cell.className+=' '+color;
      b.appendChild(cell);
    }
    cont.querySelector('.tetris-score').textContent='🏆 '+score;
    // Next piece
    const n=cont.querySelector('.tetris-next');
    if(next){n.style.gridTemplateColumns='repeat('+next.cells[0].length+',22px)';n.innerHTML='';
      for(let r=0;r<next.cells.length;r++)for(let c=0;c<next.cells[0].length;c++){
        const cell=document.createElement('div');cell.className='tetris-cell';
        if(next.cells[r][c])cell.className+=' '+next.color;
        n.appendChild(cell);
      }
    }
  }

  function startGame() {
    if(timer){clearInterval(timer);timer=null;return;}
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    score=0;gameOver=false;next=null;
    let lvl=1;
    timer=setInterval(()=>{drop();},dropInterval);
    spawnPiece();
    container.querySelector('.tetris-start').textContent='⏸️ 暂停';
  }

  function resetGame() {
    if(timer)clearInterval(timer);timer=null;
    board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    score=0;gameOver=false;piece=null;next=null;
    container.querySelector('.tetris-start').textContent='▶️ 开始';
    draw();
  }

  document.onkeydown=(e)=>{if(window._activeKeyHandler)_activeKeyHandler(e);};
_activeKeyHandler=(e)=>{
    if(!container.querySelector('.tetris-board'))return;
    const K={ArrowLeft:()=>movePiece(-1),ArrowRight:()=>movePiece(1),ArrowDown:()=>drop(),ArrowUp:()=>rotPiece(),' ':e=>{e.preventDefault();startGame();},'x':()=>hardDrop()};
    if(K[e.key]){e.preventDefault();K[e.key]();}
  };

  window.tetrisMove=movePiece;window.tetrisRot=rotPiece;window.tetrisDrop=drop;window.tetrisHard=hardDrop;
  window.tetrisStart=startGame;window.tetrisReset=resetGame;

  container.innerHTML='<div class="game-header"><button class="back-btn" onclick="backToMenu()">← 返回</button><span class="game-title">🧱 俄罗斯方块</span></div><div class="tetris-wrap"><div class="tetris-board"></div><div class="tetris-side"><div class="tetris-score">🏆 0</div><div>下一个:</div><div class="tetris-next"></div><div class="game-controls" style="justify-content:center"><button class="tetris-start" onclick="tetrisStart()">▶️ 开始</button><button class="secondary" onclick="tetrisReset()">重置</button></div></div></div><div class="tetris-controls"><button style="grid-column:2;grid-row:1" onpointerdown="tetrisRot()">🔄</button><button style="grid-column:1;grid-row:2" onpointerdown="tetrisMove(-1)">⬅</button><button style="grid-column:2;grid-row:2" onpointerdown="tetrisDrop()">⬇</button><button style="grid-column:3;grid-row:2" onpointerdown="tetrisMove(1)">➡</button><button style="grid-column:1;grid-row:3" colspan="3" onpointerdown="tetrisHard()">⏬</button></div>';
  resetGame();
}
(function() { renderTetris(document.getElementById('gameView')); })();
</script>
</body>
</html>
