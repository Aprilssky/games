<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔨 打地鼠</title>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #252542;
  --text: #e0e0f0;
  --text2: #9292b0;
  --accent: #6c63ff;
  --accent2: #4ade80;
  --accent3: #f472b6;
  --border: #2a2a4a;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f0f0f5;
  --surface: #ffffff;
  --surface2: #e8e8f0;
  --text: #1a1a2e;
  --text2: #666680;
  --accent: #5b52e0;
  --border: #d0d0e0;
  --shadow: 0 4px 24px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; transition: background .3s;
}
/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 20px; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 8px;
  cursor: pointer; font-size: 18px; display: flex;
  align-items: center; justify-content: center; transition: .2s;
}
.theme-btn:hover { background: var(--accent); color: white; }
/* Game Grid */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; padding: 24px; max-width: 900px; margin: 0 auto;
}
.game-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; cursor: pointer;
  transition: all .25s; text-align: center;
  box-shadow: var(--shadow);
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 32px rgba(108,99,255,.25);
}
.game-card .icon { font-size: 48px; margin-bottom: 12px; }
.game-card h3 { font-size: 18px; margin-bottom: 8px; }
.game-card p { color: var(--text2); font-size: 14px; line-height: 1.5; }
/* Game View */
.game-view {
  display: none;
  padding: 20px; max-width: 600px; margin: 0 auto;
}
.game-view.active { display: block; }
.game-view .game-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.game-view .back-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 14px; transition: .2s;
}
.game-view .back-btn:hover { background: var(--accent); color: white; }
.game-view .game-title { font-size: 22px; font-weight: 700; flex: 1; }
.game-status {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.game-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.game-controls button {
  background: var(--accent); color: white; border: none;
  padding: 8px 18px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: .2s;
}
.game-controls button:hover { filter: brightness(1.15); }
.game-controls button.secondary {
  background: var(--surface2); color: var(--text);
}
.game-controls button.secondary:hover { background: var(--border); }
/* Game Board Container */
.board-wrap {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
  display: flex; justify-content: center;
}

/* Whack-a-Mole */
.whack-board { display: grid; gap: 12px; justify-content: center; }
.whack-hole {
  width: 72px; height: 72px; border-radius: 50%; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; font-size: 36px;
  cursor: pointer; transition: .15s; border: 2px solid var(--border);
}
.whack-hole.mole { background: var(--surface); border-color: var(--accent3); }
.whack-hole.mole:hover { transform: scale(1.1); }
.whack-hole:active { transform: scale(.9); }
.whack-score { font-size: 18px; font-weight: 700; }
/* Number Eater */
.ne-board-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ne-board { display: grid; background: var(--surface2); border-radius: 4px; position: relative; }
.ne-cell {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  position: relative; user-select: none;
}
.ne-cell.npc { color: var(--accent3); }
.ne-cell.player { color: var(--accent2); font-size: 13px; }
.ne-cell.player-small { background: rgba(74,222,128,.15); border-radius: 50%; }
.ne-cell.player-med { background: rgba(74,222,128,.25); border-radius: 50%; }
.ne-cell.player-large { background: rgba(74,222,128,.35); border-radius: 50%; }
.ne-cell.player-huge { background: rgba(74,222,128,.45); border-radius: 50%; }
.ne-cell.eat { animation: ne-eat .2s ease; }
@keyframes ne-eat { 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
.ne-cell.hurt { animation: ne-hurt .2s ease; color: #ff4444 !important; }
@keyframes ne-hurt { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.ne-info { display: flex; gap: 16px; align-items: center; }
.ne-info span { font-size: 14px; }
.ne-highscore { color: var(--text2); font-size: 12px; }
@m
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="gameView" class="game-view active" style="display:block;max-width:600px;margin:0 auto;padding:20px"></div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function toast(m,d){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';
  Object.assign(t.style,{position:'fixed',bottom:'30px',left:'50%',transform:'translateX(-50%)',
  background:'var(--accent)',color:'#fff',padding:'10px 24px',borderRadius:'24px',
  fontSize:'14px',fontWeight:'600',opacity:'0',transition:'opacity .3s',pointerEvents:'none',zIndex:'999'});document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',d||1500);
}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',d.dataset.theme);}
(function(){const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s;})();
function backToMenu(){window.location.href='index.html';}

function renderWhack(container) {
  const SIZE = 3;
  let score = 0, timeLeft = 30, activeMole = null, timer = null, gameRunning = false;

  container.innerHTML = `
    <div class="game-header">
      <button class="back-btn" onclick="backToMenu()">← 返回</button>
      <span class="game-title">🔨 打地鼠</span>
    </div>
    <div class="game-status">
      <span class="whack-score">⭐ <strong id="whackScore">0</strong></span>
      <span>⏱ <strong id="whackTime">30</strong>s</span>
      <div class="game-controls">
        <button id="whackStartBtn">开始</button>
      </div>
    </div>
    <div class="board-wrap"><div id="whackBoard" class="whack-board"></div></div>
  `;

  const drawBoard = () => {
    const b = $('#whackBoard');
    b.style.gridTemplateColumns = `repeat(${SIZE}, 72px)`;
    b.innerHTML = '';
    for (let i=0; i<SIZE*SIZE; i++) {
      const hole = document.createElement('div');
      hole.className = 'whack-hole' + (activeMole===i ? ' mole' : '');
      hole.textContent = activeMole===i ? '🐹' : '';
      hole.dataset.i = i;
      hole.onclick = () => whack(i);
      b.appendChild(hole);
    }
  };

  const spawnMole = () => {
    if (!gameRunning) return;
    if (activeMole !== null) {
      const prev = activeMole;
      activeMole = null;
      drawBoard();
      activeMole = prev;
    }
    const total = SIZE*SIZE;
    let next = Math.floor(Math.random()*total);
    // Avoid same spot in a row
    while (next === activeMole) next = Math.floor(Math.random()*total);
    activeMole = next;
    drawBoard();
  };

  const whack = (i) => {
    if (!gameRunning || i !== activeMole) return;
    score++;
    $('#whackScore').textContent = score;
    activeMole = null;
    toast('💥 +1', 300);
    drawBoard();
  };

  const startGame = () => {
    if (gameRunning) return;
    score = 0; timeLeft = 30; activeMole = null; gameRunning = true;
    $('#whackScore').textContent = '0';
    $('#whackTime').textContent = '30';
    $('#whackStartBtn').textContent = '游戏中...';
    drawBoard();
    spawnMole();
    timer = setInterval(() => {
      timeLeft--;
      $('#whackTime').textContent = timeLeft;
      spawnMole();
      if (timeLeft <= 0) {
        clearInterval(timer); timer=null;
        gameRunning = false; activeMole = null;
        $('#whackStartBtn').textContent = '再玩一次';
        drawBoard();
        toast('⏰ 时间到！得分：'+score, 2000);
      }
    }, 800);
  };

  document.getElementById('whackStartBtn').onclick = startGame;
  drawBoard();
}
(function() {
  const v = document.getElementById('gameView');
  renderWhack(v);
  // Clean up duplicate toast
  if (v.querySelector('#toast')) v.querySelector('#toast').remove();
})();
</script>
</body>
</html>
